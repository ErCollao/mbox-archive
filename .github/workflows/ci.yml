name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    container:
      image: rust:1.99-slim
    steps:
      # rust:slim ships no git; actions/checkout needs it inside the container.
      # Runs BEFORE checkout, so it must not inherit a backend/ working-directory
      # (that dir doesn't exist yet in the container → exec chdir fails).
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
        name: Install git for checkout
      - uses: actions/checkout@v4
      - name: Clippy
        run: rustup component add clippy && cargo clippy --all-targets -- -D warnings
        working-directory: backend
      - name: Test
        run: cargo test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
