services:
  backend:
    build: ./backend
    # No ports exposed to host, only accessible within docker network
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${BACKUP_DIR:-./backup}:/backup
      - index-data:/index
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3132:3000"
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend

volumes:
  index-data:
