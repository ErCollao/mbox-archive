services:
  backend:
    build: ./backend
    # No ports exposed to host, only accessible within docker network
    volumes:
      - ${PROFILES_DIR:-./profiles}:/profiles
      - ${DATA_DIR:-./data}:/data
      - ${ARCHIVE_DIR:-./archive}:/archive
      - ${BACKUP_DIR:-./backup}:/backup
      - index-data:/index
    restart: unless-stopped
    healthcheck:
      # /api/profiles is the one endpoint that answers without a session,
      # so it doubles as a liveness probe; a broken backend never says OK
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/profiles"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3132:3000"
    environment:
      - BACKEND_URL=http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/welcome').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  index-data:
